# nginx site for https://rackview.example.org -> the app on port 8765.
# Copy to /etc/nginx/sites-available/, link into sites-enabled, set the certificate paths,
# set TRUST_PROXY=1 in /etc/rackview/config.env, then reload nginx and restart the app.
server {
    listen 80;
    server_name rackview.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name rackview.example.org;
    ssl_certificate     /etc/ssl/certs/rackview.example.org.crt;
    ssl_certificate_key /etc/ssl/private/rackview.example.org.key;
    client_max_body_size 20m;   # feature/bug photos
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
